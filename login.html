<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NuelPay</title>

   
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
       
      .auth-body{

background:linear-gradient(135deg,#86a1f6,#0B2FA5,#114FE3);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;
margin-top: 4px;
}

.auth-container{

width:100%;

max-width:430px;

background:rgba(251, 250, 250, 0.08);

backdrop-filter:blur(20px);

border-radius:20px;

padding:40px;

box-shadow:0 20px 60px rgba(0,0,0,.3);

animation:fadeIn .8s ease;


}

.logo{
     display: flex;
     justify-content:space-between;
    align-items:center;
    padding: 20px 10px;
   font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    margin-top: -10px;
  
}
.logo-icon{
     display:flex;
     justify-content: right;
    
    padding: 20px;
    
    font-size: 50px;
    
    
}
 .logo-icon h2{
    color:white;
    font-size:1.5rem;
    font-weight:bold;  
   text-align: center;
   margin-top: 10px;
   margin-bottom: 5px;
 }
.left{
    width:12px;
    height:45px;
    background:#2d6cff;
    border-radius:8px;
    transform:skew(-10deg);
    margin-right:-1px;
}

.right{
    width:10px;
    height:30px;
    background:#55b7ff;
    border-radius:8px;
    transform:skew(17deg);
    margin-left:-3px;
}
.left1{
    width:12px;
    height:39px;
    background:#2d6cff;
    border-radius:8px;
    transform:skew(-9deg);
    margin-left:-4px;
}

.logo span{

color:#55b7ff;

}

.logo-text h1{

color:rgb(243, 240, 240);

margin-top:9px;
margin-bottom: 14px;
font-size:35px;

text-shadow: 2px 2px 5px rgb(3, 3, 3);

text-align: center;
font-family: "Montserrat";

}
.logo-header{
    margin-bottom: 25px;
    padding: 20px 10px;
}
.auth-container p{

color:#f4f5f7;

margin-top:7px;
margin-bottom: 4px;
font-family: "Arial";


}

.logo-text p{

color:#f4f5f7;

margin-top:7px;
margin-bottom: 20px;
font-family: "Arial";


}

.input-box{

display:flex;

align-items:center;

background:rgba(255,255,255,.08);

margin-bottom:20px;

padding:16px;

border-radius:12px;

}

.input-box i{

color:#55b7ff;

}

.input-box input{

flex:1;

background:none;

border:none;

outline:none;

color:white;

font-size:16px;

padding-left:15px;

}

.input-box input::placeholder{

color:#d0d9ff;

}

.togglePassword{

cursor:pointer;

}

.remember{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

font-size:14px;

}

.remember label{

color:white;

}

.remember a{

color:#55b7ff;

text-decoration:none;

}

.auth-form button{

width:100%;

padding:15px;

background:#2563eb;

color:white;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.auth-form button:hover{

background:#3b82f6;

transform:translateY(-3px);

}

.bottom-text{

text-align:center;

margin-top:25px;

color:white;

}

.bottom-text a{

color:#55b7ff;

text-decoration:none;

font-weight:bold;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}
.wave{
    display:inline-block;
    animation:wave 2s infinite;
    transform-origin:70% 70%;
}

@keyframes wave{
    0%,100%{transform:rotate(0deg);}
    10%{transform:rotate(14deg);}
    20%{transform:rotate(-8deg);}
    30%{transform:rotate(14deg);}
    40%{transform:rotate(-4deg);}
    50%{transform:rotate(10deg);}
}

.back-btn{
    position: absolute;
    
    background: #2563eb;
    color: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-size: 10px;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
    margin-top: 14px;
    margin-bottom: 18px;
}

.back-btn:hover{
    background: #1d4ed8;
    transform: translateX(-5px);
}
.popup{
    position: fixed;
    top:0;
    left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}
.popup-content{
    width:380px;
    max-width: 90%;
    background: white;
    border-radius:20px;
    padding: 40px 30px;
    text-align: center;
    animation: pop .4s ease;
}
.popup-content i{
    font-size: 65px;
    color: #2563eb;
    margin-bottom: 20px;
}
.popup-content h2{
    margin-bottom: 15px;
    color: #081B57;
}
.popup-content p{
    color:#555;
    line-height: 1.6;
}
.popup-content button{
    margin-top: 30px;
    width:100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    cursor: pointer;
}
.popup-content button:hover{
    background: #1d4ed8;
}

@keyframes pop{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform: scale(1);
        opacity:1;
    }
}
 

    </style>
</head>

<body class="auth-body">

<div class="auth-container">

     <div class="logo">
      <div class="logo-icon">
            <div class="left"></div>
            <div class="right"></div>
            <div class="left1"></div>
        <h2>Nuel<span color="blue">Pay</span></h2></div></div>

       <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i>Home</a>

        <div class="logo-text">
          <div class="logo-header">
      <h1>Welcome Back <span class="wave">👋</span></h1></div>
        <p>Login to continue banking smarter.</p></div>
    

    <form id="loginForm" class="auth-form">

        <div class="input-box">
            <i class="fas fa-envelope"></i>
            <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>
        </div>

        <div class="input-box">
            <i class="fas fa-lock"></i>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <i class="fas fa-eye" id="togglePassword"></i>
        </div>

        <div class="remember">
            <label>
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">
            Login
        </button>

        <p class="bottom-text">
            Don't have an account?

            <a href="register.html">
                Register
            </a>
        </p>

    </form>
    <div class="popup" id="successPopup">
    <div class="popup-content">
        <i class="fas fa-circle-check"></i>
<h2>Login Successful!</h2>
<p>Redirecting.....</p>
       
    </div></div>

</div>

</div>

<script>
   const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function(event){

    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    const user = JSON.parse(localStorage.getItem("user"));

    if(user === null){
        alert("No account found. Please register first.");
        return;
    }

    if(email !== user.email || password !== user.password){
        alert("Invalid email or password.");
        return;
    }

    document.getElementById("successPopup").style.display = "flex";

    setTimeout(function () {
window.location.href = "dashboard.html";
    }, 3000);
    

});
const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function () {

    if (password.type === "password") {
        password.type = "text";
        togglePassword.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        password.type = "password";
        togglePassword.classList.replace("fa-eye-slash", "fa-eye");
    }

});
</script>

</body>
</html>
