<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
   .auth-body{

background:linear-gradient(135deg,#86a1f6,#0B2FA5,#114FE3);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:15px;
margin-top: 4px;
}

.auth-container{

width:100%;

max-width:430px;

background:rgba(252, 248, 248, 0.08);

backdrop-filter:blur(20px);

border-radius:20px;

padding:40px;

box-shadow:0 20px 60px rgba(0,0,0,.3);

animation:fadeIn .8s ease;


}

.logo{
     display: flex;
     justify-content:space-between;
    align-items:center;
    padding: 20px 10px;
   font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    margin-top: 0px;
  
}
.logo-icon{
     display:flex;
     justify-content: right;
    margin-top: -10px;
    padding: 20px;
    
    font-size: 50px;
    
    
}
 .logo-icon h2{
    color:white;
    font-size:1.5rem;
    font-weight:bold;  
   text-align: center;
   margin-top: 10px;
   margin-bottom: 5px;
 }
.left{
    width:12px;
    height:45px;
    background:#2d6cff;
    border-radius:8px;
    transform:skew(-10deg);
    margin-right:-1px;
}

.right{
    width:10px;
    height:30px;
    background:#55b7ff;
    border-radius:8px;
    transform:skew(17deg);
    margin-left:-3px;
}
.left1{
    width:12px;
    height:39px;
    background:#2d6cff;
    border-radius:8px;
    transform:skew(-9deg);
    margin-left:-4px;
}

.logo span{

color:#55b7ff;

}

.logo-text h1{

color:rgb(243, 240, 240);

margin-top:21px;
margin-bottom: 21px;
font-size:30px;
padding: 10px;
text-shadow: 2px 2px 5px rgb(3, 3, 3);

text-align: center;
font-family: "Montserrat";

}
.logo-header{
  margin-top: 12px;
    margin-bottom: 18px;
    padding:  10px;
}
.auth-container p{

color:#f4f5f7;

margin-top:7px;
margin-bottom: 4px;
font-family: "Arial";


}

.logo-text p{

color:#f4f5f7;

margin-top:7px;
margin-bottom: 27px;
font-family: "Arial";


}

.input-box{

display:flex;

align-items:center;

background:rgba(255,255,255,.08);

margin-bottom:20px;

padding:16px;

border-radius:12px;

}

.input-box i{

color:#55b7ff;

}

.input-box input{

flex:1;

background:none;

border:none;

outline:none;

color:white;

font-size:16px;

padding-left:15px;

}

.input-box input::placeholder{

color:#d0d9ff;

}

.togglePassword{

cursor:pointer;

}
.toggleConfirm{

cursor:pointer;

}
.remember{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

font-size:14px;

}

.remember label{

color:white;

}

.remember a{

color:#55b7ff;

text-decoration:none;

}

.auth-form button{

width:100%;

padding:15px;

background:#2563eb;

color:white;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.auth-form button:hover{

background:#3b82f6;

transform:translateY(-3px);

}

.bottom-text{

text-align:center;

margin-top:25px;

color:white;

}

.bottom-text a{

color:#55b7ff;

text-decoration:none;

font-weight:bold;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.back-btn{
    position: absolute;
    
    background: #2563eb;
    color: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-size: 10px;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
    margin-top: 14px;
    margin-bottom: 18px;
}

.back-btn:hover{
    background: #1d4ed8;
    transform: translateX(-5px);
}

.popup{
    position: fixed;
    top:0;
    left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}
.popup-content{
    width:380px;
    max-width: 90%;
    background: white;
    border-radius:20px;
    padding: 40px 30px;
    text-align: center;
    animation: pop .4s ease;
}
.popup-content i{
    font-size: 65px;
    color: #2563eb;
    margin-bottom: 20px;
}
.popup-content h2{
    margin-bottom: 15px;
    color: #081B57;
    font-size: 19px;
    font-weight: bold;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
}
.popup-content p{
    color:#272626;
    line-height: 1.6;
    font-weight: bold;
    font-size: 19px;
}
.popup-content button{
    margin-top: 30px;
    width:100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    cursor: pointer;
}
.popup-content button:hover{
    background: #1d4ed8;
}

@keyframes pop{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform: scale(1);
        opacity:1;
    }
}
 

</style>

</head>

<body class="auth-body">

<div class="auth-container">

     <div class="logo">
      <div class="logo-icon">
            <div class="left"></div>
            <div class="right"></div>
            <div class="left1"></div>
        <h2>Nuel<span color="blue">Pay</span></h2></div></div>

        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i>Home</a>
      
        <div class="logo-text">
          <div class="logo-header">
      <h1><i class="fas fa-building-columns"></i>Create Your Account</h1></div>

<p>Open your secure NuelPay account in just a few steps.</p></div>
    
<!-- REGISTER -->
 <form id="registerForm" class="auth-form">

<div class="input-box">
    <i class="fas fa-user"></i>
    <input
    type="text"
    id="fullname"
    placeholder="Full Name"
    required>
</div>

  <div class="input-box">
    <i class="fas fa-user"></i>
    <input
    type="text"
    id="username"
    placeholder="Username"
    required>
</div>


<div class="input-box">
    <i class="fas fa-envelope"></i>
    <input
    type="email"
    id="email"
    placeholder="Email Address"
    required>
</div>

<div class="input-box">
    <i class="fas fa-phone"></i>
    <input
    type="tel"
    id="phone"
    placeholder="Phone Number"
    required>
</div>

<div class="password-box">
<div class="input-box">
    <i class="fas fa-lock"></i>
    <input
    type="password"
    id="password"
    placeholder="Password"
    required>

    <i class="fas fa-eye" id="togglePassword"></i>
</div></div>

<div class="password-box">
<div class="input-box">
    <i class="fas fa-lock"></i>
    <input
    type="password"
    id="confirmPassword"
    placeholder="Confirm Password"
    required>

    <i class="fas fa-eye" id="toggleConfirmPassword"></i>
</div></div>

<div class="remember">

<label>

<input type="checkbox" required>

I agree to the

<a href="#">Terms & Conditions</a>

</label>

</div>
<button type="submit">

Create Account

</button>
<p class="bottom-text">

Already have an account?

<a href="login.html">

Login

</a>

</p>
</div>
</form>
<div class="popup" id="successPopup">
    <div class="popup-content">
        <i class="fas fa-star"></i>

        <h2>Account Created!</h2>
        <p>Welcome to NuelPay<br> Your account has been created successfully <i class="fas fa-party-horn"></i></p>
        <button id="continueBtn">Continue to Login</button>
    </div></div>

</div>

<script>



const registerForm = document.getElementById("registerForm");
registerForm.addEventListener("submit", function(event) {
event.preventDefault();


const fullname = document.getElementById("fullname").value.trim();

const username = document.getElementById("username").value.trim();

const email = document.getElementById("email").value.trim();

const phone = document.getElementById("phone").value.trim();

const password = document.getElementById("password").value;

const confirmPassword = document.getElementById("confirmPassword").value;


if (!fullname || !username || !email || !phone || !password || !confirmPassword) {
    alert("Please fill in all fields.");
    return;
}

const user = {
    fullname,
    username,
    email,
    phone,
    password
};

localStorage.setItem("user", JSON.stringify(user));

document.getElementById("successPopup").style.display = "flex";

});
const continueBtn = document.getElementById("continueBtn");
continueBtn.addEventListener("click", function(){

    window.location.href = "login.html";
})



const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function(){

   console.log("Eye clicked");

    if(password.type === "password"){

        password.type = "text";

        togglePassword.classList.remove("fa-eye");
        togglePassword.classList.add("fa-eye-slash");

    }else{

        password.type = "password";

        togglePassword.classList.remove("fa-eye-slash");
        togglePassword.classList.add("fa-eye");

    }

});

const confirmPassword = document.getElementById("confirmPassword");
const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");

toggleConfirmPassword.addEventListener("click", function () {

    if (confirmPassword.type === "password") {
        confirmPassword.type = "text";
        toggleConfirmPassword.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        confirmPassword.type = "password";
        toggleConfirmPassword.classList.replace("fa-eye-slash", "fa-eye");
    }

});

</script>

</body>
</html>
