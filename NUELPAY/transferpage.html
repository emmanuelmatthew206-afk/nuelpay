<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Bank Transfer - NuelPay</title>
  
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #010929;
      color: white;
    }
    
    .page {
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
    }
    
    .back {
      color: #55b7ff;
      text-decoration: none;
      font-size: 18px;
    }
    
    .box {
      background: white;
      color: #081b57;
      padding: 30px;
      border-radius: 25px;
      margin-top: 30px;
    }
    
    .box h1 {
      margin-top: 0;
      font-size: 30px;
    }
    
    .amount {
      background: #eef4ff;
      padding: 20px;
      border-radius: 15px;
      margin: 20px 0;
    }
    
    .amount small {
      color: #666;
    }
    
    .amount h2 {
      margin: 5px 0 0;
      color: #2563eb;
    }
    
    .account {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }
    
    .account-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
    }
    
    .account-row span {
      color: #555;
    }
    
    .account-row strong {
      color: #081b57;
    }
    
    .copy {
      border: none;
      background: #2563eb;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .done {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  
  <div class="page">
    
    <a href="dashboard.html" class="back">← Back to Dashboard</a>
    
    <div class="box">
      
      <h1>Bank Transfer</h1>
      
      <p>Transfer the amount below to your NuelPay account.</p>
      
      <div class="amount">
        <small>Deposit Amount</small>
        <h2 id="depositAmount">₦0.00</h2>
      </div>
      
      <div class="account">
        
        <div class="account-row">
          <span>Bank</span>
          <strong>NuelPay Bank</strong>
        </div>
        
        <div class="account-row">
          <span>Account Name</span>
          <strong>NuelPay User</strong>
        </div>
        
        <div class="account-row">
          <span>Account Number</span>
          
          <div>
            <strong id="accountNumber">1234567890</strong>
            
            <button class="copy" onclick="copyAccount()">
              Copy
            </button>
          </div>
        </div>
        
      </div>
      
    <button id="confirmTransfer">I've Made The Transfer</button>
    </div>
    
  </div>
<script>
  const amount = Number(localStorage.getItem("depositAmount")) || 0;
  
  document.getElementById("depositAmount").textContent =
    `₦${amount.toLocaleString()}.00`;
  
  
  // COPY ACCOUNT NUMBER
  function copyAccount() {
    const accountNumber =
      document.getElementById("accountNumber").textContent.trim();
    
    navigator.clipboard.writeText(accountNumber)
      .then(() => {
        alert("Account number copied!");
      })
      .catch(() => {
        alert("Unable to copy account number.");
      });
  }
  
  
  // CONFIRM TRANSFER
  const confirmTransfer =
    document.getElementById("confirmTransfer");
  
  confirmTransfer.addEventListener("click", function() {
    alert("Transfer submitted. Your deposit is being processed.");
  });
</script>
  
</body>

</html>
